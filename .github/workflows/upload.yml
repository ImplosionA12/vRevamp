name: Upload to Web Store

# MANUAL ONLY. This used to run on every tag and push to the Chrome Web Store
# under the extension id inherited from the upstream project. This project is
# distributed from GitHub (unpacked), so a tag must never try to publish
# anywhere: it failed on 2026-10-10 only because no credentials are configured
# here. Run it by hand from the Actions tab if a Web Store listing is ever
# created, after replacing extensionID with this project's own.
on:
  workflow_dispatch:

jobs:
  upload-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # never publish a build the verification suite hasn't passed
      - name: Verify content-script features
        run: npm test

      - name: Pack extension
        run: bash .github/pack.sh extension.zip
        shell: bash

      - name: Upload to webstore
        uses: ExtensionNinja/extension-publish@main
        with:
          action: upload
          extensionID: jfmlhhjlkbliphgkmeingeacbijcilcl
          clientID: ${{ secrets.CI_GOOGLE_CLIENT_ID }}
          clientSecret: ${{ secrets.CI_GOOGLE_CLIENT_SECRET }}
          clientRefreshToken: ${{ secrets.CI_GOOGLE_REFRESH_TOKEN }}
          extensionFile: extension.zip
